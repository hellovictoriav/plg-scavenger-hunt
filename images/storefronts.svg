<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Closed storefront on Flatbush">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d405b"/>
      <stop offset="100%" stop-color="#81b29a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect x="200" y="120" width="400" height="280" fill="#f4f1de" rx="4"/>
  <rect x="240" y="160" width="320" height="200" fill="#1d1d1d" opacity="0.15"/>
  <line x1="240" y1="280" x2="560" y2="280" stroke="#e07a5f" stroke-width="8"/>
  <text x="400" y="250" text-anchor="middle" fill="#3d405b" font-family="Georgia, serif" font-size="42" font-weight="bold">CLOSED</text>
  <text x="400" y="380" text-anchor="middle" fill="#f4f1de" font-family="Georgia, serif" font-size="18">What should be here?</text>
  <text x="400" y="55" text-anchor="middle" fill="#f4f1de" font-family="Georgia, serif" font-size="22">Ghosts of Storefronts</text>
</svg>
