<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Flatbush Avenue storefronts">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4a261"/>
      <stop offset="100%" stop-color="#e76f51"/>
    </linearGradient>
    <linearGradient id="street" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#264653"/>
      <stop offset="100%" stop-color="#2a9d8f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <rect y="320" width="800" height="180" fill="url(#street)"/>
  <rect x="60" y="180" width="140" height="140" fill="#e9c46a" opacity="0.9"/>
  <rect x="220" y="150" width="160" height="170" fill="#f1faee"/>
  <rect x="400" y="170" width="130" height="150" fill="#a8dadc"/>
  <rect x="550" y="140" width="190" height="180" fill="#457b9d"/>
  <rect x="90" y="210" width="50" height="60" fill="#1d3557"/>
  <rect x="250" y="190" width="70" height="90" fill="#1d3557"/>
  <rect x="430" y="210" width="45" height="55" fill="#1d3557"/>
  <rect x="600" y="180" width="80" height="100" fill="#1d3557"/>
  <text x="400" y="60" text-anchor="middle" fill="#1d3557" font-family="Georgia, serif" font-size="28" font-weight="bold">Flatbush Avenue</text>
  <text x="400" y="95" text-anchor="middle" fill="#1d3557" font-family="Georgia, serif" font-size="16">Ocean Ave ’ Church Ave</text>
  <text x="400" y="460" text-anchor="middle" fill="#f1faee" font-family="Georgia, serif" font-size="14">Historic commercial corridor</text>
</svg>
